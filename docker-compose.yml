version: "3.8"

# ============================================
# Docker Compose for Laravel Application
# Production-ready configuration
# ============================================

services:
    # ============================================
    # Application Service (Laravel + Nginx + PHP-FPM)
    # ============================================
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: perpus_app
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./storage:/var/www/html/storage
            - ./bootstrap/cache:/var/www/html/bootstrap/cache
            - ./.env:/var/www/html/.env:ro
        environment:
            - APP_ENV=${APP_ENV:-production}
            - APP_DEBUG=${APP_DEBUG:-false}
            - APP_KEY=${APP_KEY}
            - DB_CONNECTION=${DB_CONNECTION:-mysql}
            - DB_HOST=db
            - DB_PORT=${DB_PORT:-3306}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - CACHE_DRIVER=${CACHE_DRIVER:-redis}
            - SESSION_DRIVER=${SESSION_DRIVER:-redis}
            - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - perpus_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    # ============================================
    # Database Service (MySQL)
    # ============================================
    db:
        image: mysql:8.0
        container_name: perpus_db
        restart: unless-stopped
        ports:
            - "${DB_PORT_EXTERNAL:-3306}:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_CHARSET: utf8mb4
            MYSQL_COLLATION: utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
        command: --default-authentication-plugin=mysql_native_password
        networks:
            - perpus_network
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "${DB_USERNAME}",
                    "-p${DB_PASSWORD}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # ============================================
    # Redis Service (Cache, Session, Queue)
    # ============================================
    redis:
        image: redis:7-alpine
        container_name: perpus_redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT_EXTERNAL:-6379}:6379"
        volumes:
            - redis_data:/data
            - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
        command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-}
        networks:
            - perpus_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ============================================
    # Queue Worker Service
    # ============================================
    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: perpus_queue
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./storage:/var/www/html/storage
            - ./.env:/var/www/html/.env:ro
        environment:
            - APP_ENV=${APP_ENV:-production}
            - DB_HOST=db
            - REDIS_HOST=redis
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        depends_on:
            - app
            - redis
        networks:
            - perpus_network

    # ============================================
    # Scheduler Service (Cron Jobs)
    # ============================================
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: perpus_scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./storage:/var/www/html/storage
            - ./.env:/var/www/html/.env:ro
        environment:
            - APP_ENV=${APP_ENV:-production}
            - DB_HOST=db
            - REDIS_HOST=redis
        command: >
            sh -c "while true; do
              php artisan schedule:run --verbose --no-interaction &
              sleep 60
            done"
        depends_on:
            - app
        networks:
            - perpus_network

    # ============================================
    # Cloudflare Tunnel Service
    # ============================================
    cloudflared:
        image: cloudflare/cloudflared:latest
        container_name: perpus_cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
        environment:
            - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
        depends_on:
            - app
        networks:
            - perpus_network

# ============================================
# Networks
# ============================================
networks:
    perpus_network:
        driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local
